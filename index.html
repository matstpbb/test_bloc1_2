
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site</title>

    <style>
        /* Style général */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            color: #111827;
        }

        /* Barre de navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #f3f4f6;
            border-bottom: 1px solid #ddd;
        }

        header h2 {
            margin: 0;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #111827;
        }

        nav a:hover {
            color: #2563eb;
        }

        /* Contenu principal */
        main {
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        main h1 {
            font-size: 40px;
        }

        main p {
            font-size: 20px;
            color: #4b5563;
        }

        /* Bouton */
        button {
            margin-top: 20px;
            padding: 15px 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Pied de page */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #f3f4f6;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <header>
        <h2>site 2</h2>

        <nav>
            <a href="#accueil">Accueil</a>
            <a href="#apropos">À propos</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="accueil">
        <h1>Bonjour !</h1>

        <p>Bienvenue sur mon site web.</p>
p
        <button onclick="direBonjour()">
            Clique ici
        </button>
    </main>

    <footer>
        © 2026 MonSite. Tous droits réservés.
    </footer>

    <script>
        function direBonjour() {
            alert("Bonjour et bienvenue sur mon site !");
        }
    </script>

</body>
</html>
